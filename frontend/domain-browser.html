<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScrapeFlow — Browse Domains</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/domain-browser.css">
</head>
<body>
  <header class="topbar">
    <h1>ScrapeFlow</h1>
    <nav>
      <a href="/">Search</a>
      <a href="/domain-browser.html" class="active">Browse Domains</a>
      <button class="report-btn" id="report-btn" type="button">Today's Report</button>
    </nav>
  </header>

  <main>
    <div id="grid-view">
      <div class="domain-grid" id="domain-grid"></div>
    </div>

    <div id="jobs-view">
      <span class="back-link" id="back-link">&larr; Back to all domains</span>
      <h2 id="jobs-heading"></h2>
      <div class="status-line" id="status-line"></div>
      <div id="results-container"></div>
      <div class="pagination" id="pagination" style="display:none">
        <button id="prev-btn" type="button">&larr; Prev</button>
        <span id="page-label"></span>
        <button id="next-btn" type="button">Next &rarr;</button>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="report-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="report-date-title">Today's Report</h2>
        <button class="modal-close" id="report-close" type="button">&times;</button>
      </div>
      <div class="report-summary" id="report-summary"></div>
      <table class="report-table">
        <thead>
          <tr><th>Domain</th><th>New Today</th><th>Ingested Today</th><th>Total</th></tr>
        </thead>
        <tbody id="report-rows"></tbody>
      </table>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/domain-browser.js"></script>
</body>
</html>

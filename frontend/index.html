<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScrapeFlow — Search</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bfd'/%3E%3Ctext x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-mark">S</span>
      <span class="brand-name">ScrapeFlow</span>
    </a>
    <nav>
      <a href="/" class="active">Search</a>
      <a href="/domain-browser.html">Browse Domains</a>
      <button class="report-btn" id="report-btn" type="button">Today's Report</button>
    </nav>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="q" placeholder="Type a keyword to search...">
      <button id="search-btn" type="button">Search</button>
      <button id="clear-btn" type="button" class="ghost-btn">Clear</button>
    </div>

    <div class="status-line" id="status-line"></div>
    <div id="results-container"></div>
    <div class="pagination" id="pagination" style="display:none">
      <button id="prev-btn" type="button">&larr; Prev</button>
      <span id="page-label"></span>
      <button id="next-btn" type="button">Next &rarr;</button>
    </div>
  </main>

  <div class="modal-overlay" id="report-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="report-date-title">Today's Report</h2>
        <button class="modal-close" id="report-close" type="button">&times;</button>
      </div>
      <div class="report-summary" id="report-summary"></div>
      <table class="report-table">
        <thead>
          <tr><th>Domain</th><th>New Today</th><th>Ingested Today</th><th>Total</th></tr>
        </thead>
        <tbody id="report-rows"></tbody>
      </table>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
